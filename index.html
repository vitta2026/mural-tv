<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - Clínica</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      font-family: sans-serif;
    }

    .mural-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.8s ease-in-out;
    }

    .legenda {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background-color: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="mural-container">
    <img id="slide" src="" alt="Carregando...">
    <div class="legenda" id="legenda-texto">Aguarde...</div>
  </div>

  <script>
    // URLs diretas e funcionais para o teste
    const imagens = [
      "https://picsum.photos/id/1067/1920/1080", // Exemplo Ambiente
      "https://picsum.photos/id/1074/1920/1080", // Exemplo Profissionais
      "https://picsum.photos/id/1068/1920/1080", // Exemplo Sala de Atendimento
      "https://picsum.photos/id/1060/1920/1080"  // Exemplo Consultório
    ];

    const titulos = [
      "Bem-vindo à nossa Clínica",
      "Conheça nossa Equipe de Profissionais",
      "Salas Modernas e Confortáveis (6 Salas)",
      "Agende sua Consulta"
    ];

    let index = 0;
    const tempoPorSlide = 5000; // 5 segundos por foto

    const imgElement = document.getElementById('slide');
    const legendaElement = document.getElementById('legenda-texto');

    function trocarSlide() {
      imgElement.src = imagens[index];
      legendaElement.innerText = titulos[index];
      index = (index + 1) % imagens.length;
    }

    trocarSlide();
    setInterval(trocarSlide, tempoPorSlide);
  </script>

</body>
</html>
