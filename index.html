<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mural Digital - Vitta Saúde</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .mural-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img, iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none; /* Evita cliques na TV */
    }

    img.ativo, iframe.ativo {
      opacity: 1;
      pointer-events: auto;
    }

    img {
      object-fit: cover;
    }

    @media (max-width: 768px) {
      img {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>

  <div class="mural-container">
    <img id="slide" src="" alt="Mural Digital" class="ativo">
    <!-- Embed do YouTube com autoplay e som desativado (obrigatório para autoplay rodar em TVs/Browsers) -->
    <iframe id="tv-player" src="" allow="autoplay; encrypted-media"></iframe>
  </div>

  <script>
    const imagens = [
      "foto1.jpg",
      "foto2.jpg",
      "foto3.jpg",
      "foto4.jpg",
      "foto5.jpg",
      "foto6.jpg"
    ];

    // Coloque aqui o ID do vídeo ao vivo da CNN Brasil no YouTube (a parte depois de watch?v=)
    const youtubeLiveID = "i_Lw360d2_I"; 

    let index = 0;
    const tempoPorSlide = 15000; // 15 segundos por foto
    const tempoTV = 180000;      // 3 minutos (180.000 ms) para a TV

    const imgElement = document.getElementById('slide');
    const tvElement = document.getElementById('tv-player');

    function exibirFotos() {
      // Oculta o player de TV e zera o SRC para economizar memória/banda
      tvElement.classList.remove('ativo');
      tvElement.src = "";

      // Exibe a primeira foto
      imgElement.src = imagens[index];
      imgElement.classList.add('ativo');

      // Loop das fotos
      const intervalFotos = setInterval(() => {
        imgElement.style.opacity = 0;

        setTimeout(() => {
          index++;

          // Se passou da última foto, para o carrossel de fotos e chama a TV
          if (index >= imagens.length) {
            clearInterval(intervalFotos);
            index = 0; // Reinicia o contador para o próximo ciclo
            exibirTV();
            return;
          }

          imgElement.src = imagens[index];
          imgElement.style.opacity = 1;
        }, 800);

      }, tempoPorSlide);
    }

    function exibirTV() {
      // Esconde a foto
      imgElement.classList.remove('ativo');

      // Carrega o vídeo ao vivo com autoplay e muted (necessário para permissão de auto-exibição)
      tvElement.src = `https://www.youtube.com/embed/${youtubeLiveID}?autoplay=1&mute=1&controls=0`;
      tvElement.classList.add('ativo');

      // Aguarda 3 minutos e volta para a sequência de fotos
      setTimeout(() => {
        exibirFotos();
      }, tempoTV);
    }

    // Inicia o fluxo com as fotos
    exibirFotos();
  </script>

</body>
</html>
