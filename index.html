<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mural Digital - Vitta Saúde</title>
  <!-- Biblioteca para rodar streams HLS (.m3u8) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .mural-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img, video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      object-fit: cover;
    }

    img.ativo, video.ativo {
      opacity: 1;
    }

    @media (max-width: 768px) {
      img {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>

  <div class="mural-container">
    <img id="slide" src="" alt="Mural Digital" class="ativo">
    <!-- Player de Vídeo Nativo para transmissão contínua -->
    <video id="tv-player" autoplay muted playsinline></video>
  </div>

  <script>
    const imagens = [
      "foto1.jpg",
      "foto2.jpg",
      "foto3.jpg",
      "foto4.jpg",
      "foto5.jpg",
      "foto6.jpg"
    ];

    // Link do sinal ao vivo continuo HLS (.m3u8)
    // Exemplo: Canal de Notícias / Record News / TV pública
    const streamURL = "https://recordnews-lh.akamaihd.net/i/recordnews_hls@186595/index_1800_av-p.m3u8"; 

    let index = 0;
    const tempoPorSlide = 15000; // 15 segundos por foto
    const tempoTV = 180000;      // 3 minutos (180.000 ms) para a TV

    const imgElement = document.getElementById('slide');
    const videoElement = document.getElementById('tv-player');
    let hls = null;

    function exibirFotos() {
      // Pausa o vídeo da TV e remove o sinal para não consumir internet no fundo
      if (hls) {
        hls.destroy();
        hls = null;
      }
      videoElement.pause();
      videoElement.classList.remove('ativo');

      // Inicia a exibição das imagens
      imgElement.src = imagens[index];
      imgElement.classList.add('ativo');

      const intervalFotos = setInterval(() => {
        imgElement.style.opacity = 0;

        setTimeout(() => {
          index++;

          if (index >= imagens.length) {
            clearInterval(intervalFotos);
            index = 0; 
            exibirTV();
            return;
          }

          imgElement.src = imagens[index];
          imgElement.style.opacity = 1;
        }, 800);

      }, tempoPorSlide);
    }

    function exibirTV() {
      imgElement.classList.remove('ativo');
      videoElement.classList.add('ativo');

      // Conecta o streaming contínuo sem dependência do YouTube
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(streamURL);
        hls.attachMedia(videoElement);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          videoElement.play();
        });
      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        // Suporte para Safari (iOS/Mac)
        videoElement.src = streamURL;
        videoElement.play();
      }

      // Após 3 minutos, volta para as fotos
      setTimeout(() => {
        exibirFotos();
      }, tempoTV);
    }

    // Inicia o mural
    exibirFotos();
  </script>

</body>
</html>
