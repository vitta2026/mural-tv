<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mural Digital - Vitta Saúde</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .mural-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Na TV/PC, preenche a tela inteira */
      display: block;
      opacity: 1;
      transition: opacity 0.8s ease-in-out; /* Controla a velocidade do esmaecimento */
    }

    /* --- REGRAS ESPECÍFICAS PARA CELULAR --- */
    @media (max-width: 768px) {
      img {
        object-fit: contain; /* No celular mostra a foto inteira sem cortar */
      }
    }
  </style>
</head>
<body>

  <div class="mural-container">
    <img id="slide" src="" alt="Mural Digital">
  </div>

  <script>
    const imagens = [
      "foto1.jpg",
      "foto2.jpg",
      "foto3.jpg",
      "foto4.jpg"
    ];

    let index = 0;
    const tempoPorSlide = 15000; // 15 segundos

    const imgElement = document.getElementById('slide');

    function trocarSlide() {
      // 1. Reduz a opacidade para sumir com a imagem atual
      imgElement.style.opacity = 0;

      // 2. Aguarda o tempo da animação (800ms) antes de trocar a imagem e reaparecer
      setTimeout(() => {
        imgElement.src = imagens[index];
        imgElement.style.opacity = 1;
        index = (index + 1) % imagens.length;
      }, 800); 
    }

    trocarSlide();
    setInterval(trocarSlide, tempoPorSlide);
  </script>

</body>
</html>
