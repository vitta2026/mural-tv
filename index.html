<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mural Digital - Vitta Saúde</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .mural-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img, iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
    }

    img.ativo, iframe.ativo {
      opacity: 1;
      pointer-events: auto;
    }

    img {
      object-fit: cover;
    }

    @media (max-width: 768px) {
      img {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>

  <div class="mural-container">
    <img id="slide" src="" alt="Mural Digital" class="ativo">
    <iframe id="tv-player" src="" allow="autoplay; encrypted-media"></iframe>
  </div>

  <script>
    const imagens = [
      "foto1.jpg",
      "foto2.jpg",
      "foto3.jpg",
      "foto4.jpg",
      "foto5.jpg",
      "foto6.jpg"
    ];

    // ID do Canal da CNN Brasil no YouTube (Fixo)
    const channelID = "UCvdwhh_fDyWccR42-hReJmA"; 

    let index = 0;
    const tempoPorSlide = 15000; // 15 segundos por foto
    const tempoTV = 180000;      // 3 minutos (180.000 ms) para a TV

    const imgElement = document.getElementById('slide');
    const tvElement = document.getElementById('tv-player');

    function exibirFotos() {
      // Oculta o player e encerra o vídeo para não gastar dados/memória
      tvElement.classList.remove('ativo');
      tvElement.src = "";

      // Exibe a foto atual
      imgElement.src = imagens[index];
      imgElement.classList.add('ativo');

      const intervalFotos = setInterval(() => {
        imgElement.style.opacity = 0;

        setTimeout(() => {
          index++;

          // Se passou da última foto, para as fotos e vai para a TV
          if (index >= imagens.length) {
            clearInterval(intervalFotos);
            index = 0; 
            exibirTV();
            return;
          }

          imgElement.src = imagens[index];
          imgElement.style.opacity = 1;
        }, 800);

      }, tempoPorSlide);
    }

    function exibirTV() {
      imgElement.classList.remove('ativo');

      // Puxa a LIVE que estiver ativa no canal oficial da CNN Brasil no momento
      tvElement.src = `https://www.youtube.com/embed/live_stream?channel=${channelID}&autoplay=1&mute=1&controls=0`;
      tvElement.classList.add('ativo');

      // Espera 3 minutos e volta para as fotos
      setTimeout(() => {
        exibirFotos();
      }, tempoTV);
    }

    // Inicia a exibição
    exibirFotos();
  </script>

</body>
</html>
